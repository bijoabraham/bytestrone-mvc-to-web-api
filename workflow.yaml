# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: migrate-mvc-to-web-api
    name: Migrate MVC to Web API
    type: automatic
    steps:
      - name: "Scaffold API"
        ast-grep:
          config_file: rules/scaffold-api.yml
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
      - name: "Action Result"
        ast-grep:
          config_file: rules/action-result.yml
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
      - name: "Swap Verbs (Index)"
        ast-grep:
          config_file: rules/swap-verb-index.yml
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
      - name: "Swap Verbs (Filter)"
        ast-grep:
          config_file: rules/swap-verb-filter.yml
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
      - name: "Swap Verbs (Details)"
        ast-grep:
          config_file: rules/swap-verb-details.yml
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
      - name: "View Returns"
        ast-grep:
          config_file: rules/view-returns.yml
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
      - name: "EF Namespaces"
        ast-grep:
          config_file: rules/ef-namespaces.yml
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
      - name: "EF Entity Type Configuration"
        ast-grep:
          config_file: rules/ef-entity-type.yml
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
      - name: "EF Builder Prefix"
        ast-grep:
          config_file: rules/ef-builder-prefix.yml
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
      - name: "EF Value Generated"
        ast-grep:
          config_file: rules/ef-value-generated.yml
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
      - name: "MVC Namespaces"
        ast-grep:
          config_file: rules/mvc-namespaces.yml
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
      - name: "Upgrade to SDK Project Format"
        ai:
          prompt: "Analyze the existing legacy .csproj files in this repository. Create new .NET 8 SDK-style .csproj files to replace them, keeping any necessary Nuget package references but removing the explicit file includes. Overwrite the old .csproj files."
      - name: "Generate Program.cs"
        ai:
          prompt: "Analyze the repository, specifically looking for Global.asax or Global.asax.cs if it still exists. Scaffold a modern ASP.NET Core 8 Program.cs file at the root of the web project that configures controllers, routing, and any necessary services (like EF Core DbContext) based on the legacy configuration. Also remove Global.asax and Global.asax.cs since they are obsolete in .NET 8."
